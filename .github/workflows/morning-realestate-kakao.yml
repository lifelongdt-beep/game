name: Morning Real Estate News to KakaoTalk

on:
  schedule:
    # 매일 08:00 KST(오전) = 전날 23:00 UTC. 시간을 바꾸려면 이 값을 수정하세요.
    - cron: '0 23 * * *'
    # 매일 17:00 KST(오후) = 08:00 UTC.
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send KakaoTalk real estate news digest
        id: send
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          ARTICLE_COUNT: '10'
          NEWS_QUERY: '부동산 when:1d'
          DIGEST_PAGE_URL: 'https://lifelongdt-beep.github.io/game/'
          GEOMDAN_ARTICLE_COUNT: '10'
          # 거래·가격(청약/분양/실거래가/시세 등)뿐 아니라 개발·교통 호재, 붕괴·하자
          # 같은 악재까지 검단신도시 부동산에 영향을 주는 폭넓은 주제를 모두 잡는다.
          GEOMDAN_QUERY: '("검단신도시" OR "검단구") (청약 OR 분양 OR 실거래가 OR 시세 OR 매매 OR 전세 OR 입주 OR 미분양 OR 개발 OR 도시계획 OR 지구단위계획 OR 택지 OR 재개발 OR 교통 OR 철도 OR 지하철 OR GTX OR 도로 OR 학교 OR 상권 OR 인프라 OR 병원 OR 붕괴 OR 하자 OR 안전진단 OR 침수) when:1d'
          GEOMDAN_KEYWORD: '검단'
          GEOMDAN_PAGE_URL: 'https://lifelongdt-beep.github.io/game/geomdan.html'
          # 국토교통부 아파트 매매 실거래가 상세 자료(공공데이터포털). 시크릿이 없으면
          # 이 부분만 자동으로 건너뛰고 나머지는 그대로 동작합니다.
          # LAWD_CD=28290은 검단구(2026-07-01 인천시 행정구역 개편으로 서구에서
          # 분리됨). 자세한 내용은 docs/kakao-realestate-news-setup.md 참고.
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          LAWD_CD: '28290'
          GEOMDAN_TRANSACTION_COUNT: '10'
        run: node scripts/kakao-realestate-news.js

      # 카카오는 오픈채팅방에 대신 글을 올려주는 API가 없어서, 재부키 방에는
      # docs/index.html(고정 링크, 일반 부동산 뉴스)을 방장봇 공지로 걸어두고 내용만
      # 매일 갱신하는 방식으로 대신합니다. docs/geomdan.html은 검단신도시 전용 페이지로,
      # 서로 완전히 분리되어 있습니다. 자세한 내용은 docs/kakao-realestate-news-setup.md 참고.
      - name: Publish today's digest pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/geomdan.html
          if git diff --cached --quiet; then
            echo "변경 사항 없음, 커밋 생략"
          else
            git commit -m "docs: 오늘의 부동산 뉴스 갱신"
            git push
          fi

      # KAKAO_REFRESH_TOKEN은 카카오 정책상 주기적으로 재발급될 수 있습니다.
      # GH_PAT(레포 secrets 쓰기 권한)이 등록되어 있으면 자동으로 시크릿을 갱신하고,
      # 없으면 경고만 남기고 넘어갑니다. 자세한 내용은 docs/kakao-realestate-news-setup.md 참고.
      - name: Rotate KAKAO_REFRESH_TOKEN secret if Kakao issued a new one
        if: steps.send.outputs.new_refresh_token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_REFRESH_TOKEN: ${{ steps.send.outputs.new_refresh_token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT 시크릿이 없어 KAKAO_REFRESH_TOKEN을 자동 갱신하지 못했습니다. docs/kakao-realestate-news-setup.md 안내에 따라 수동으로 갱신해주세요."
            exit 0
          fi
          gh secret set KAKAO_REFRESH_TOKEN --repo "$TARGET_REPO" --body "$NEW_REFRESH_TOKEN"
          echo "KAKAO_REFRESH_TOKEN 시크릿을 자동으로 갱신했습니다."
