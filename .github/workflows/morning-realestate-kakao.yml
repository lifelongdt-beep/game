name: Morning Real Estate News to KakaoTalk

on:
  schedule:
    # 매일 06:07 KST(오전) = 전날 21:07 UTC. 시간을 바꾸려면 이 값을 수정하세요.
    # 분을 0이 아닌 값(07)으로 둔 이유: GitHub Actions의 schedule 트리거는
    # "최선 노력"이라 정시(매시 0분)에 몰리는 요청이 특히 밀린다고 공식 문서에
    # 명시돼 있다. 실제로 이 저장소도 정시 예약 실행이 매번 1~5시간씩 늦게
    # 실행된 것을 실행 이력으로 확인해서, 07분으로 옮겼다 — 다만 GitHub가
    # 정확한 시각 실행을 보장하지는 않으므로 이 조정만으로 지연이 완전히
    # 사라진다는 보장은 없다.
    - cron: '7 21 * * *'
    # 매일 18:07 KST(오후) = 09:07 UTC.
    - cron: '7 9 * * *'
  workflow_dispatch:
    inputs:
      notify_message:
        description: '입력하면 평소 뉴스/실거래가 대신 이 문구만 카카오톡으로 즉시 전송합니다(점검 결과 알림 등 1회성 메시지용).'
        required: false
        type: string
      skip_kakao_send:
        description: 'true로 두면 뉴스/실거래가는 평소대로 수집·페이지 갱신하되 카카오톡 자동 다이제스트 발송만 건너뜁니다(사람이 직접 고른 큐레이션 브리핑을 별도로 만들어 보낼 때, 자동 다이제스트가 중복으로 나가지 않도록 하는 용도).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: TEMP og:image 추출 진단 (확인 후 되돌릴 예정)
        run: |
          cat > /tmp/diag.js <<'DIAGEOF'
          async function fetchArticleOgImage(articleUrl) {
            try {
              const res = await fetch(articleUrl, {
                redirect: 'follow',
                headers: {
                  'User-Agent':
                    'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                },
              });
              if (!res.ok) return { ok: false, status: res.status, finalUrl: res.url };
              const html = await res.text();
              const patterns = [
                /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i,
                /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i,
                /<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"']+)["']/i,
                /<meta[^>]+content=["']([^"']+)["'][^>]+name=["']twitter:image["']/i,
              ];
              for (const pattern of patterns) {
                const match = html.match(pattern);
                if (match) return { ok: true, image: match[1], finalUrl: res.url };
              }
              return { ok: true, image: null, finalUrl: res.url };
            } catch (err) {
              return { ok: false, error: err.message };
            }
          }

          const urls = [
            ['사업자대출 용도외유용', 'https://news.google.?oc=5'],
            ['한은 수도권 집값', 'https://news.google.?oc=5'],
            ['사고차량 대출 총책', 'https://news.google.com/rss/articles/CBMiW0FVX3lxTE40dzE5RFRjMUlBMXdsbms5bXh2SUNMdEVXLU1OLU12anFXR05FYU5KbUM1WDgwQ0RVbjFkU3hFR0xtLVQ3RF9MTGZoeVJQaEVGZlRqbnBISmtpZ2c?oc=5'],
            ['한은 기준금리 v.daum', 'https://news.google.com/rss/articles/CBMiT0FVX3lxTFBKa2hrcWJNcld4djdibzFuZUE5R2hoSm9sM2ZtckZNdDdMWGpwS1kySUlwSi1EUHkzWUNQdUE0TXRSLXktXzFpZ1hSUUMyYzg?oc=5'],
            ['계양신도시 카이브 유보라 분양', 'https://news.google.com/rss/articles/CBMibkFVX3lxTE03bUxrNzlWekFPWGtEelJkTXlEY0NpQVU0WjAzNzhFZFZja2FGVURpeExGckFXRk83Wlk2NENjQ29qUFpYZWJiQjU5RGFnOFVvcl9mU2N1SmtIcFBaUVdlbTdWbEZVb0VUckVnS3V3?oc=5'],
            ['계양신도시 첫 입주 인천일보', 'https://news.google.com/rss/articles/CBMicEFVX3lxTE95anF2b0p5TzB6aE4yYi1QSExlTkNEWG5sRHlLai1IbFNxNXdqTjFTTEtMS3VSYkFhdVlPb0thQ1BkLXdGSnh1aGZYQmZ3NzVDWVl6VXRuaVJVNnEyektURkdHQlI4cVZOUi1uV3BJME0?oc=5'],
          ];

          (async () => {
            const url = urls[0][1];
            const res = await fetch(url, {
              redirect: 'follow',
              headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' },
            });
            console.log('status:', res.status, 'finalUrl:', res.url);
            const html = await res.text();
            console.log('length:', html.length);
            const cwiz = html.match(/data-p="([^"]+)"/);
            console.log('data-p found:', !!cwiz);
            if (cwiz) console.log('data-p sample:', cwiz[1].slice(0, 300));
            const canonical = html.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/i);
            console.log('canonical:', canonical ? canonical[1] : null);
            const metaRefresh = html.match(/<meta[^>]+http-equiv=["']refresh["'][^>]+content=["']([^"']+)["']/i);
            console.log('meta refresh:', metaRefresh ? metaRefresh[1] : null);
            console.log('--- first 1500 chars ---');
            console.log(html.slice(0, 1500));
          })();
          DIAGEOF
          node /tmp/diag.js

      - name: Send KakaoTalk real estate news digest
        id: send
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          NOTIFY_MESSAGE: ${{ github.event.inputs.notify_message }}
          # 정기 스케줄(schedule) 실행은 뉴스·실거래가 수집과 페이지 갱신만 하고
          # 카카오톡 자동 다이제스트는 보내지 않는다 — 이제는 사람이 직접 고른
          # "재부키 부동산 분석" 큐레이션 브리핑(오전 7시·오후 7시)이 그 자리를
          # 대신하기 때문. 수동 실행(workflow_dispatch)은 기존처럼 입력값을 따른다.
          SKIP_KAKAO_SEND: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.skip_kakao_send }}
          # 매일 보내는 다이제스트 메시지 맨 아래에 항상 붙는 오픈채팅방 초대 문구.
          OPENCHAT_INVITE_TEXT: '이 메세지를 매일 보고 검단신도시 관련 집단지성을 느끼고 싶으시면 재부키 오픈채팅방으로 오세요.'
          OPENCHAT_URL: 'https://open.kakao.com/o/gSHroBKh'
          ARTICLE_COUNT: '20'
          # "부동산"이라는 단어 없이 지표명만으로 쓰이는 기사(예: "전세가율 60%
          # 돌파")도 잡아내려고 시장 지표·정책·거래 관련 키워드를 폭넓게 추가했다.
          NEWS_QUERY: '(부동산 OR 매매가격지수 OR 전세가격지수 OR 전세가율 OR 매매수급지수 OR 거래량 OR 미분양 OR "준공 후 미분양" OR "인허가 실적" OR "착공 실적" OR "분양 실적" OR "입주 물량" OR 기준금리 OR 대출금리 OR "스트레스 DSR" OR 대출한도 OR "다주택자 양도세 중과" OR 취득세 OR 종합부동산세 OR "공시가격 현실화" OR 공정시장가액비율 OR 토지거래허가구역 OR 소비자심리지수 OR 매수우위지수 OR 급매물 OR 전세난 OR 갭투자 OR 역전세 OR "임대차 2법" OR 계약갱신청구권 OR PIR OR 청약경쟁률 OR 분양가상한제 OR 재건축 OR 재개발 OR "규제지역 해제" OR "지방 미분양" OR "서울 신축 공급") when:1d'
          DIGEST_PAGE_URL: 'https://lifelongdt-beep.github.io/game/'
          GEOMDAN_ARTICLE_COUNT: '20'
          # ① 검단신도시/인천 검단/서구 검단/검단구와 반드시 함께 언급된 기사만, 교통·분양청약·
          # 시세거래·생활인프라·정책금융 분야의 구체적인 키워드로 좁혀서 찾는다. 검단구는
          # 2026-07-01 행정구역 개편으로 생기는 명칭이라 미리 넣어 둔다.
          GEOMDAN_QUERY: '(검단신도시 OR "인천 검단" OR "서구 검단" OR 검단구) ("인천1호선 연장" OR 검단선 OR "계양역 환승" OR 아라역 OR 신검단중앙역 OR 검단호수공원역 OR GTX-D OR "서울지하철 5호선 연장" OR "검단~드림로 연결도로" OR "마곡 접근성" OR "DMC 접근성" OR "강남 접근성" OR 청약경쟁률 OR "1순위 청약" OR 미분양 OR "악성 미분양" OR 입주물량 OR "AA블록 분양" OR "검단 센트럴시티" OR 분양가 OR "초기 분양률" OR 실거래가 OR "매매가 상승" OR 갭투자 OR "역세권 프리미엄" OR "검단신도시 시세" OR 인구증가 OR "상업시설 입지" OR 대형마트 OR "프랜차이즈 입점" OR "복합쇼핑몰" OR 스타벅스 OR 백화점 OR 멀티플렉스 OR CGV OR 메가박스 OR 롯데시네마 OR "문화시설 개관" OR 문화회관 OR 문화예술회관 OR 공공문화복지시설 OR 학군 OR "규제지역 해제" OR 대출한도 OR DSR OR "수도권 서북부 부동산") when:1d'
          GEOMDAN_KEYWORD: '검단'
          # ② "검단" 언급이 없어도, 생활권·교통망을 공유해 검단신도시에 영향을 줄 만한
          # 인접 지역(3기 신도시·인접 택지지구 등) 개발 이슈는 별도로 찾는다. ①과 합쳐
          # 유사 헤드라인은 하나로 묶고, ①에 안 걸리고 ②에서만 걸린 기사는 페이지·
          # 카카오톡 메시지에 "인접 지역 호재" 딱지만 붙인다(본문을 읽지 못해 실제
          # 영향 내용까지 요약하지는 않는다).
          GEOMDAN_NEARBY_QUERY: '(계양신도시 OR "계산지구 도시개발사업" OR "김포 콤팩트시티" OR 청라국제도시 OR 루원시티 OR "왕길1구역 재개발" OR "검단3·5구역 재개발" OR 에코메타시티 OR "한들3구역" OR "인천국제공항고속도로 검단IC 개통" OR "서부권 광역급행철도" OR GTX-D OR "수도권 제2순환고속도로" OR "인천2호선 고양지선" OR 대장신도시 OR 마곡신도시) when:1d'
          # 국토교통부 아파트 매매 실거래가 상세 자료(공공데이터포털). 시크릿이 없으면
          # 이 부분만 자동으로 건너뛰고 나머지는 그대로 동작합니다.
          # LAWD_CD=28290은 검단구(2026-07-01 인천시 행정구역 개편으로 서구에서
          # 분리됨) 전체를 조회하고, GEOMDAN_DONGS로 그중 신도시로 개발된 법정동만
          # 한 번 더 걸러냅니다. 자세한 내용은 docs/kakao-realestate-news-setup.md 참고.
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          LAWD_CD: '28290'
          GEOMDAN_DONGS: '당하동,마전동,불로동,원당동'
          GEOMDAN_TRANSACTION_COUNT: '100'
          GEOMDAN_TRANSACTION_DAYS: '30'
        run: node scripts/kakao-realestate-news.js

      # 카카오는 오픈채팅방에 대신 글을 올려주는 API가 없어서, 재부키 방에는
      # docs/index.html(고정 링크)을 방장봇 공지로 걸어두고 내용만 매일 갱신하는
      # 방식으로 대신합니다. docs/geomdan.html도 같은 내용(부동산 뉴스+검단신도시
      # 뉴스+검단신도시 실거래가)을 담아서, 예전에 geomdan.html을 따로 북마크/공지
      # 해둔 경우에도 링크가 깨지지 않습니다. 자세한 내용은 docs/kakao-realestate-news-setup.md 참고.
      - name: Publish today's digest pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/geomdan.html docs/geomdan-transactions-cache.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음, 커밋 생략"
          else
            git commit -m "docs: 오늘의 부동산 뉴스 갱신"
            git push
          fi

      # KAKAO_REFRESH_TOKEN은 카카오 정책상 주기적으로 재발급될 수 있습니다.
      # GH_PAT(레포 secrets 쓰기 권한)이 등록되어 있으면 자동으로 시크릿을 갱신하고,
      # 없으면 경고만 남기고 넘어갑니다. 자세한 내용은 docs/kakao-realestate-news-setup.md 참고.
      - name: Rotate KAKAO_REFRESH_TOKEN secret if Kakao issued a new one
        if: steps.send.outputs.new_refresh_token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_REFRESH_TOKEN: ${{ steps.send.outputs.new_refresh_token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT 시크릿이 없어 KAKAO_REFRESH_TOKEN을 자동 갱신하지 못했습니다. docs/kakao-realestate-news-setup.md 안내에 따라 수동으로 갱신해주세요."
            exit 0
          fi
          gh secret set KAKAO_REFRESH_TOKEN --repo "$TARGET_REPO" --body "$NEW_REFRESH_TOKEN"
          echo "KAKAO_REFRESH_TOKEN 시크릿을 자동으로 갱신했습니다."
