<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아침 부동산">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>아침 부동산 브리핑</title>
<!--
  지역 선택형 아침 브리핑 화면. 데이터는 scripts/regional-briefing.js가 매일 data/에 쓴 JSON을 읽는다.
  주소 #r=28185(시군구 코드) 또는 #r=f-geomdan(추천 동네)로 바로 열 수 있고, 고른 동네·주제는 이 기기에 기억한다.
-->
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--sub:#667085;--line:#e6e8ec;--accent:#1f6feb;--accent-soft:#e8f0fe;--warn:#b54708;--warn-soft:#fef0c7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#eceef2;--sub:#9aa3b2;--line:#2a2f38;--accent:#6ea8ff;--accent-soft:#1b2a44;--warn:#fdb022;--warn-soft:#3a2a0a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 80px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 0 14px}
header.top h1{margin:0;font-size:24px;line-height:1.25}
.meta{color:var(--sub);font-size:14px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;text-decoration:none;white-space:nowrap;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
section.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
section.card h2{margin:0 0 10px;font-size:18px}
h3{font-size:16px;margin:16px 0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap-chips{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat div{flex:1 1 0;min-width:120px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--sub);font-size:13px}
ol.news,ol.rank,ul.tx,ul.pick{list-style:none;margin:0;padding:0}
ol.news li,ol.rank li,ul.tx li{padding:10px 0;border-top:1px solid var(--line)}
ol.news li:first-child,ol.rank li:first-child,ul.tx li:first-child{border-top:0}
ol.news a{color:var(--ink);text-decoration:none;font-weight:600}
.src{color:var(--sub);font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px;font-weight:600}
ol.rank li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:baseline}
ol.rank .no{color:var(--accent);font-weight:700}
ol.rank .name{font-weight:600}
ol.rank .val{font-weight:700;text-align:right}
.sub{color:var(--sub);font-size:13px}
ul.tx li{display:flex;justify-content:space-between;gap:10px}
.note{color:var(--sub);font-size:14px;margin:0}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.links{display:flex;gap:8px;flex-wrap:wrap}
ul.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
ul.pick button{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font-size:15px;cursor:pointer;font-family:inherit}
ul.pick button.mine{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
input.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:16px;font-family:inherit}
.more{margin-top:10px}
footer{color:var(--sub);font-size:13px;text-align:center;margin-top:24px}
#install{display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="note" style="padding:40px 0;text-align:center">불러오는 중…</div>

  <!-- 동네 고르기 -->
  <div id="picker" hidden>
    <header class="top"><div><h1>☀️ 아침 부동산 브리핑</h1><div class="meta">우리 동네를 고르면 다음부터 바로 열려요</div></div>
      <button id="pickerBack" class="btn" hidden>닫기</button></header>
    <section class="card"><h2>⭐ 추천 동네</h2><ul id="featuredList" class="pick"></ul></section>
    <section class="card"><h2>📍 전국 시군구</h2>
      <input id="search" class="search" type="search" placeholder="동네 이름으로 찾기 (예: 분당, 해운대, 연수구)" autocomplete="off">
      <div id="sidoChips" class="chips wrap-chips" style="margin-top:12px"></div>
      <ul id="regionList" class="pick" style="margin-top:12px"></ul>
    </section>
    <section class="card"><h2>📱 홈 화면에 추가하기</h2>
      <p class="note">아이폰은 사파리 공유 버튼 → "홈 화면에 추가", 안드로이드는 크롬 메뉴 → "홈 화면에 추가"를 누르면 앱처럼 열 수 있어요.</p>
      <p style="margin:10px 0 0"><button id="install" class="btn primary">홈 화면에 설치</button></p></section>
  </div>

  <!-- 브리핑 -->
  <div id="briefing" hidden>
    <header class="top"><div><h1 id="title"></h1><div id="subtitle" class="meta"></div></div>
      <button id="changeRegion" class="btn">동네 바꾸기</button></header>
    <section id="linksCard" class="card" hidden><div id="links" class="links"></div></section>
    <section class="card"><h2>🧭 뉴스 방향</h2>
      <p class="note" style="margin-bottom:10px">보고 싶은 주제를 고르면 그 주제 기사만 보여요. 아무것도 안 고르면 전부 보여요.</p>
      <div id="topicChips" class="chips wrap-chips"></div></section>
    <section class="card"><h2 id="localTitle"></h2><div id="localNews"></div></section>
    <section class="card"><h2 id="txTitle"></h2><div id="tx"></div></section>
    <section class="card"><h2>🇰🇷 전국 부동산 뉴스</h2><div id="nationalNews"></div></section>
    <footer id="footer"></footer>
  </div>
</div>

<script>
(function () {
  'use strict';
  var STORE_REGION = 'briefing-region', STORE_TOPICS = 'briefing-topics';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var index = null, national = null, current = null, dongFilter = '';
  var selectedTopics = [];
  try { selectedTopics = JSON.parse(store.get(STORE_TOPICS) || '[]'); } catch (e) {}
  var sido = '';

  function getJson(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); });
  }
  function validId(id) { return /^(f-[a-z0-9-]+|\d{5})$/.test(id || ''); }
  function regionLabel(r) { return r.sido + ' ' + r.name; }
  function topicLabel(key) { var t = (index.topics || []).filter(function (x) { return x.key === key; })[0]; return t ? t.label : key; }

  // ── 동네 고르기 ─────────────────────────
  function showPicker() {
    $('briefing').hidden = true; $('picker').hidden = false; $('loading').hidden = true;
    $('pickerBack').hidden = !store.get(STORE_REGION);
    var mine = store.get(STORE_REGION);
    $('featuredList').innerHTML = index.featured.map(function (f) {
      var id = 'f-' + f.id;
      return '<li><button data-id="' + esc(id) + '"' + (id === mine ? ' class="mine"' : '') + '>' + esc(f.name) + '</button></li>';
    }).join('');
    var sidos = [];
    index.regions.forEach(function (r) { if (sidos.indexOf(r.sido) < 0) sidos.push(r.sido); });
    if (!sido) { var m = index.regions.filter(function (r) { return r.code === mine; })[0]; sido = m ? m.sido : sidos[0]; }
    $('sidoChips').innerHTML = sidos.map(function (s) { return '<button class="chip" data-sido="' + esc(s) + '" aria-pressed="' + (s === sido) + '">' + esc(s) + '</button>'; }).join('');
    renderRegionList();
    window.scrollTo(0, 0);
  }
  function renderRegionList() {
    var q = $('search').value.trim().replace(/\s+/g, '');
    var mine = store.get(STORE_REGION);
    var list = index.regions.filter(function (r) {
      return q ? (r.sido + r.name).replace(/\s+/g, '').indexOf(q) >= 0 : r.sido === sido;
    });
    $('sidoChips').hidden = !!q;
    $('regionList').innerHTML = list.length ? list.map(function (r) {
      return '<li><button data-id="' + esc(r.code) + '"' + (r.code === mine ? ' class="mine"' : '') + '>' + esc(q ? regionLabel(r) : r.name) + '</button></li>';
    }).join('') : '<li class="note">찾는 시군구가 없어요. 시·군·구 이름으로 찾아보세요.</li>';
  }

  // ── 브리핑 ──────────────────────────────
  function openRegion(id) {
    if (!validId(id)) return showPicker();
    $('loading').hidden = false; $('picker').hidden = true; $('briefing').hidden = true;
    getJson('data/' + id + '.json').then(function (data) {
      current = data; dongFilter = '';
      store.set(STORE_REGION, id);
      try { if (location.hash !== '#r=' + id) history.replaceState(null, '', '#r=' + id); } catch (e) {}
      renderBriefing();
    }).catch(function () {
      $('loading').hidden = true;
      alertBox('이 동네 자료가 아직 없어요. 매일 새벽에 모으니 내일 다시 열어 주세요.');
      showPicker();
    });
  }
  function alertBox(msg) {
    var el = document.createElement('p'); el.className = 'warn'; el.textContent = msg;
    $('picker').insertBefore(el, $('picker').children[1]);
    setTimeout(function () { el.remove(); }, 6000);
  }

  function matchesTopics(a) {
    if (!selectedTopics.length) return true;
    return (a.tp || []).some(function (k) { return selectedTopics.indexOf(k) >= 0; });
  }
  function newsHtml(list, emptyText, limit) {
    if (!list.length) return '<p class="note">' + esc(emptyText) + '</p>';
    return '<ol class="news">' + list.slice(0, limit || 15).map(function (a) {
      var tags = (a.tp || []).map(function (k) { return '<span class="tag">' + esc(topicLabel(k)) + '</span>'; }).join('');
      var href = /^https?:\/\//.test(a.l) ? a.l : '#';
      return '<li><a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(a.t) + '</a><div class="src">' + tags + esc(a.s) + (a.n > 1 ? ' · ' + a.n + '개 매체' : '') + '</div></li>';
    }).join('') + '</ol>';
  }

  function won(n) {
    if (!n && n !== 0) return '-';
    var eok = Math.floor(n / 10000), rest = n % 10000;
    if (eok <= 0) return n.toLocaleString('ko-KR') + '만원';
    return rest ? eok + '억 ' + rest.toLocaleString('ko-KR') + '만원' : eok + '억원';
  }
  function manwon(n) { return n ? Math.round(n).toLocaleString('ko-KR') + '만원' : '-'; }

  function renderTx() {
    var tx = current.tx || { items: [] };
    var months = tx.months || 3;
    var rows = (tx.items || []).map(function (r) { return { apt: r[0], dong: r[1], area: r[2], amount: r[3], floor: r[4], date: r[5], ppy: r[6] }; });
    var dongs = [];
    rows.forEach(function (r) { if (dongs.indexOf(r.dong) < 0) dongs.push(r.dong); });
    dongs.sort();
    if (dongFilter && dongs.indexOf(dongFilter) < 0) dongFilter = '';
    var view = dongFilter ? rows.filter(function (r) { return r.dong === dongFilter; }) : rows;
    var html = '';
    if (tx.status === 'nokey') return $('tx').innerHTML = '<p class="note">실거래가 자료를 아직 받지 못했어요.</p>';
    if (tx.stale) html += '<p class="warn">오늘 실거래가 조회가 실패해 ' + esc(tx.staleFrom) + ' 자료를 보여드려요.</p>';
    else if (tx.status === 'partial') html += '<p class="warn">일부 달의 조회가 실패해 거래가 빠졌을 수 있어요.</p>';
    else if (tx.status === 'error') html += '<p class="warn">오늘 실거래가 조회가 실패했어요.</p>';
    if (!rows.length) return $('tx').innerHTML = html + '<p class="note">최근 ' + months + '개월 안에 신고된 아파트 거래가 없어요.</p>';
    if (dongs.length > 1) {
      html += '<div class="chips" id="dongChips"><button class="chip" data-dong="" aria-pressed="' + !dongFilter + '">전체</button>' +
        dongs.map(function (d) { return '<button class="chip" data-dong="' + esc(d) + '" aria-pressed="' + (d === dongFilter) + '">' + esc(d) + '</button>'; }).join('') + '</div>';
    }
    var ppys = view.map(function (r) { return r.ppy; }).filter(Boolean).sort(function (a, b) { return a - b; });
    var median = ppys.length ? ppys[Math.floor(ppys.length / 2)] : null;
    html += '<div class="stat"><div><b>' + view.length.toLocaleString('ko-KR') + '건</b><span>최근 ' + months + '개월 거래</span></div><div><b>' + manwon(median) + '</b><span>평당가 중앙값</span></div></div>';
    var best = {}, order = [];
    view.filter(function (r) { return r.ppy; }).sort(function (a, b) { return b.ppy - a.ppy || b.amount - a.amount; }).forEach(function (r) {
      var k = r.apt.replace(/\([^)]*\)/g, '').replace(/\s+/g, '');
      if (!best[k]) { best[k] = r; order.push(r); }
    });
    var top = order.slice(0, 10);
    if (top.length) {
      html += '<h3>단지별 최고 평당가 TOP ' + top.length + '</h3><ol class="rank">' + top.map(function (r, i) {
        return '<li><span class="no">' + (i + 1) + '</span><div><div class="name">' + esc(r.apt) + '</div><div class="sub">' + esc(r.dong) + ' · ' + Math.round(r.area) + '㎡ · ' + esc(r.floor) + '층 · ' + esc(r.date) + ' · ' + esc(won(r.amount)) + '</div></div><span class="val">' + manwon(r.ppy) + '</span></li>';
      }).join('') + '</ol>';
    }
    html += '<h3>최근 거래</h3><ul class="tx">' + view.slice(0, 15).map(function (r) {
      return '<li><div><div>' + esc(r.apt) + '</div><div class="sub">' + esc(r.dong) + ' · ' + Math.round(r.area) + '㎡ · ' + esc(r.floor) + '층 · ' + esc(r.date) + '</div></div><b>' + esc(won(r.amount)) + '</b></li>';
    }).join('') + '</ul>';
    html += '<p class="note" style="margin-top:10px">국토교통부 아파트 매매 실거래가, 해제된 계약 제외. 평당가는 전용면적으로 추정한 공급면적 기준이에요.</p>';
    $('tx').innerHTML = html;
  }

  function renderNews() {
    var local = (current.news || []).filter(matchesTopics);
    var emptyLocal = selectedTopics.length ? '고른 주제의 동네 소식이 오늘은 없어요.' : '지난 24시간 동안 이 동네 부동산 소식이 없어요.';
    $('localNews').innerHTML = newsHtml(local, emptyLocal);
    if (!national) { $('nationalNews').innerHTML = '<p class="note">전국 뉴스를 불러오지 못했어요.</p>'; return; }
    var list;
    if (selectedTopics.length) {
      var seen = {}; list = [];
      selectedTopics.forEach(function (k) {
        (national.topics[k] || []).forEach(function (a) { if (!seen[a.l]) { seen[a.l] = 1; list.push(a); } });
      });
      list.sort(function (a, b) { return (b.n || 1) - (a.n || 1); });
    } else list = national.main || [];
    $('nationalNews').innerHTML = newsHtml(list, '고른 주제의 전국 뉴스가 오늘은 없어요.', 12);
  }

  function renderTopicChips() {
    $('topicChips').innerHTML = '<button class="chip" data-topic="" aria-pressed="' + !selectedTopics.length + '">전체</button>' +
      index.topics.map(function (t) { return '<button class="chip" data-topic="' + esc(t.key) + '" aria-pressed="' + (selectedTopics.indexOf(t.key) >= 0) + '">' + esc(t.label) + '</button>'; }).join('');
  }

  function renderBriefing() {
    var isFeatured = !!current.id;
    var name = current.name;
    var region = index.regions.filter(function (r) { return r.code === current.code; })[0];
    $('title').textContent = '☀️ ' + name;
    $('subtitle').textContent = (region ? regionLabel(region) : '') + ' · ' + (current.generatedAtText || '') + ' 기준';
    document.title = name + ' 아침 부동산 브리핑';
    var links = (current.links || []).filter(function (l) { return /^(\.\.?\/|[a-z0-9-]+\.html)/i.test(l.href); });
    $('linksCard').hidden = !links.length;
    $('links').innerHTML = links.map(function (l) { return '<a class="btn" href="' + esc(l.href) + '">' + esc(l.label) + '</a>'; }).join('');
    $('localTitle').textContent = '📰 ' + name + ' 소식';
    $('txTitle').textContent = '🏘️ ' + name + ' 실거래가';
    $('footer').textContent = '매일 새벽 자동으로 갱신돼요. 기사 제목은 구글 뉴스 검색 결과예요.' + (isFeatured ? '' : ' 시군구 단위 자료라 동 버튼으로 좁혀 볼 수 있어요.');
    renderTopicChips(); renderNews(); renderTx();
    $('loading').hidden = true; $('picker').hidden = true; $('briefing').hidden = false;
    window.scrollTo(0, 0);
  }

  // ── 이벤트 ──────────────────────────────
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.id) return openRegion(b.dataset.id);
    if (b.dataset.sido) { sido = b.dataset.sido; return showPicker(); }
    if (b.hasAttribute('data-dong')) { dongFilter = b.dataset.dong; return renderTx(); }
    if (b.hasAttribute('data-topic')) {
      var k = b.dataset.topic;
      if (!k) selectedTopics = [];
      else if (selectedTopics.indexOf(k) >= 0) selectedTopics = selectedTopics.filter(function (x) { return x !== k; });
      else selectedTopics = selectedTopics.concat(k);
      store.set(STORE_TOPICS, JSON.stringify(selectedTopics));
      renderTopicChips(); renderNews(); return;
    }
  });
  $('changeRegion').onclick = function () { try { history.replaceState(null, '', location.pathname); } catch (e) {} showPicker(); };
  $('pickerBack').onclick = function () { openRegion(store.get(STORE_REGION)); };
  $('search').addEventListener('input', renderRegionList);
  // 공유받은 링크(#r=…)를 이미 열린 화면에서 누른 경우
  addEventListener('hashchange', function () {
    var id = (location.hash.match(/^#r=([\w-]+)$/) || [])[1];
    if (index && id && (!current || id !== (current.id ? 'f-' + current.id : current.code))) openRegion(id);
  });

  var deferred;
  addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    var b = $('install'); b.style.display = 'inline-flex';
    b.onclick = function () { deferred.prompt(); deferred = null; b.style.display = 'none'; };
  });
  if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });

  // ── 시작 ──────────────────────────────
  Promise.all([getJson('data/index.json'), getJson('data/national.json').catch(function () { return null; })]).then(function (res) {
    index = res[0]; national = res[1];
    var fromHash = (location.hash.match(/^#r=([\w-]+)$/) || [])[1];
    var id = validId(fromHash) ? fromHash : store.get(STORE_REGION);
    if (validId(id)) openRegion(id); else showPicker();
  }).catch(function () {
    $('loading').textContent = '자료를 아직 만들지 못했어요. 첫 자동 실행이 끝나면 열려요.';
  });
})();
</script>
</body>
</html>
